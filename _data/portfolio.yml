research:
  - id: isu
    title: "Experimental Aerodynamics & Data-Driven Modeling of Rotating Systems"
    org: "Iowa State University"
    period: "Jan 2026 – Present"
    status: "Current"
    icon: "fa-solid fa-fan"
    media: ""          # e.g. /assets/media/propeller-wake.gif
    media_caption: ""
    summary: "Wind tunnel experiments on rotating propeller systems combined with flow-field measurement and physics-guided machine learning."
    points:
      - "Build and operate wind tunnel test setups for rotating propellers: test stands, speed control, data acquisition."
      - "Design test matrices with design of experiments and run multi-variable test campaigns."
      - "Measure flow fields with mean and phase-locked PIV; process data in LaVision DaVis and Tecplot."
      - "Reverse-engineer complex surface geometries with 3D scanning and 3D printing for repeatable testing."
      - "Develop physics-guided machine learning models from experimental data."
    tags: ["Wind Tunnel", "PIV", "DoE", "3D Scanning", "Machine Learning"]

  - id: wind
    title: "Offshore Wind Farm Layout Optimization"
    org: "BUET · RISE-funded undergraduate thesis"
    period: "Mar 2024 – Feb 2025"
    status: "Completed"
    icon: "fa-solid fa-wind"
    media: ""
    media_caption: ""
    summary: "Statistical wind-resource assessment near Saint Martin, Bangladesh, and wake-aware turbine placement with a genetic algorithm."
    points:
      - "Assessed offshore wind farm potential using statistical analysis of wind data."
      - "Optimized turbine placement with a wake-aware genetic algorithm in Python."
      - "Site assessment published in the Asian Journal of Engineering and Technology (2025)."
    tags: ["Wind Energy", "Genetic Algorithm", "Python", "Statistics"]
    link: { label: "Paper", url: "https://doi.org/10.24203/acaphe94" }

  - id: hydro
    title: "Data-Driven Hydrostatic Prediction for Early-Stage Ship Design"
    org: "The Draft Lab · BUET"
    period: "Apr 2025 – Aug 2025"
    status: "Completed"
    icon: "fa-solid fa-ship"
    media: ""
    media_caption: ""
    summary: "Machine-learning surrogates that replace manual hydrostatic calculations, trained on an automatically generated synthetic hull dataset."
    points:
      - "Generated a synthetic hull dataset with Maxsurf parametric transformation."
      - "Automated hydrostatic calculations through MATLAB–Maxsurf batch analysis."
      - "Selected the best surrogate model through multi-metric global scoring; presented at ICME 2025."
    tags: ["Surrogate Modeling", "MATLAB", "Maxsurf", "Machine Learning"]
    link: { label: "The Draft Lab", url: "https://thedraftlab.github.io/" }

  - id: tanker
    title: "Design of a 1,700-Tonne Inland Oil Tanker"
    org: "BUET · Undergraduate design project"
    period: "Nov 2022 – Nov 2023"
    status: "Completed"
    icon: "fa-solid fa-anchor"
    media: ""
    media_caption: ""
    summary: "Complete vessel design from owner requirements through hull form, stability, resistance, and propeller cavitation checks."
    points:
      - "Developed the hull form in Rhinoceros 3D."
      - "Performed hydrostatic and stability analysis in Maxsurf."
      - "Carried out resistance prediction and propeller cavitation assessment."
    tags: ["Ship Design", "Rhinoceros 3D", "Maxsurf"]

